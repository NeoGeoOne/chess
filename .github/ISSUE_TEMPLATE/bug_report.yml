name: Bug report
description: Something does not work as expected.
labels:
- bug
body:
- type: dropdown
  id: area
  attributes:
    label: Area
    options:
    - Play
    - Puzzles
    - Learn
    - Analysis
    - Stats
    - other
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: '1. ...

      2. ...

      3. ...'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected and actual behaviour
  validations:
    required: true
- type: input
  id: environment
  attributes:
    label: Environment
    placeholder: Browser/OS or agent host and version
